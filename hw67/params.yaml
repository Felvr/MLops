model:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  device: cpu
  dtype: float32
  enable_thinking: false
data:
  train: data/tokenized/train.pt
  val: data/tokenized/val.pt
train:
  seed: 42
  max_steps: 4
  train_limit: 32
  val_limit: 8
  batch_size: 1
  grad_accum: 2
  eval_every: 2
  gradient_checkpointing: false
lora:
  dropout: 0.05
  alpha_over_r: 2
sweep:
- name: qv-r4-low
  r: 4
  lr: 0.0001
  target_modules:
  - q_proj
  - v_proj
- name: qv-r4-high
  r: 4
  lr: 0.0003
  target_modules:
  - q_proj
  - v_proj
- name: qv-r8-low
  r: 8
  lr: 0.0001
  target_modules:
  - q_proj
  - v_proj
- name: qv-r8-high
  r: 8
  lr: 0.0003
  target_modules:
  - q_proj
  - v_proj
- name: all-r8-low
  r: 8
  lr: 0.0001
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
- name: all-r8-high
  r: 8
  lr: 0.0003
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
tracking:
  uri: http://127.0.0.1:5006
  experiment: hw6-lora
registry:
  name: my-qwen-adapter
  alias: candidate
  max_val_ratio: 1.0
generation:
  max_new_tokens: 16
  system: Выбери один правильный вариант. Ответь номером и текстом ответа.
  prompts:
  - 'Метод подтверждения пневмонии: 0. общий анализ крови; 1. рентгенография грудной
    клетки; 2. спирометрия.'
  - 'Показатель запасов железа: 0. сывороточное железо; 1. ферритин; 2. гемоглобин.'

# Fast CPU experiment: 32 train / 8 val, whole examples <=256 tokens.
model:
  name: Qwen/Qwen3-0.6B
  device: cpu
  dtype: float32
  enable_thinking: false
  revision: c1899de289a04d12100db370d81485cdf75e47ca
data:
  train: data/tokenized/train.pt
  val: data/tokenized/val.pt
  source_train: ../hw4/data/tokenized/train.pt
  source_val: ../hw4/data/tokenized/val.pt
  subset:
    enabled: true
    train_size: 32
    val_size: 8
    max_example_tokens: 256
    seed: 42
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
train:
  seed: 42
  epochs: 1
  batch_size: 1
  grad_accum: 4
  lr: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 4
  eval_batch_size: 1
  gradient_checkpointing: false
  max_steps: 8
  num_threads: 8
variants:
- name: all_layers
  freeze_first: 0
- name: freeze14
  freeze_first: 14
compare:
  max_new_tokens: 40
  prompts:
  - What is (are) benign recurrent intrahepatic cholestasis ?
  - What is (are) congenital central hypoventilation syndrome ?
  - What is (are) Nakajo-Nishimura syndrome ?
  - What is (are) Refsum disease ?
  - What is (are) pontocerebellar hypoplasia ?
  system: You are an educational medical question-answering assistant. Answer in English
    about the condition in the question.
paths:
  models: models
  metrics: metrics
  curves: docs/curves.png
  compare: docs/compare.md

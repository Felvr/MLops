stages:
  prepare:
    cmd: uv run python -m scripts.prepare_data
    deps:
    - ../hw4/data/tokenized/train.pt
    - ../hw4/data/tokenized/val.pt
    - scripts/prepare_data.py
    - src/config.py
    - uv.lock
    params:
    - data
    - model.name
    - model.revision
    outs:
    - data/tokenized
    - docs/data.md:
        cache: false
  train_all:
    cmd: uv run python -m src.train --variant all_layers
    deps:
    - data/tokenized/train.pt
    - data/tokenized/val.pt
    - src/train.py
    - src/data.py
    - src/runtime.py
    - src/config.py
    - uv.lock
    params:
    - model
    - lora
    - train
    - variants
    - data
    - paths
    outs:
    - models/adapter_all_layers
    metrics:
    - metrics/train_all_layers.json:
        cache: true
  train_freeze:
    cmd: uv run python -m src.train --variant freeze14
    deps:
    - data/tokenized/train.pt
    - data/tokenized/val.pt
    - src/train.py
    - src/data.py
    - src/runtime.py
    - src/config.py
    - uv.lock
    params:
    - model
    - lora
    - train
    - variants
    - data
    - paths
    outs:
    - models/adapter_freeze14
    metrics:
    - metrics/train_freeze14.json:
        cache: true
  compare:
    cmd: uv run python -m src.compare --variant all_layers
    deps:
    - models/adapter_all_layers
    - src/compare.py
    - src/config.py
    - src/runtime.py
    - uv.lock
    params:
    - compare
    - model
    - train.num_threads
    - paths
    metrics:
    - metrics/compare_all_layers.json:
        cache: true
    outs:
    - docs/compare.md:
        cache: false
  plot:
    cmd: uv run python -m src.plot
    deps:
    - src/plot.py
    - src/config.py
    - metrics/train_all_layers.json
    - metrics/train_freeze14.json
    - uv.lock
    params:
    - paths
    outs:
    - docs/curves.png:
        cache: false

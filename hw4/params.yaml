model:
  name: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  enable_thinking: false

data:
  source_train: ../hw3/data/train.jsonl
  source_val: ../hw3/data/val.jsonl
  train_jsonl: data/train.jsonl
  val_jsonl: data/val.jsonl
  out_dir: data/tokenized

tokenize:
  max_seq_len: 768  # p99 train=689, val=758; см. metrics/length_sweep.json
  truncated_warn_ratio: 0.05
  padding_side: left

# Отключено: обучение с блочной маской внимания не входит в эту работу.
packing:
  enabled: false
  batch_size: 8

train_estimate:
  epochs: 3
  tokens_per_sec: 3.28
  source: ../hw1/docs/hardware.md

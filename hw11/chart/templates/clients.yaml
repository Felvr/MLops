{{- range $i := until 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: hw11-client-{{ $i }}
  labels: {app: hw11-client}
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: {{ $.Values.image | quote }}
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 250m, memory: 128Mi}
{{- end }}

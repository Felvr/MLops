groups:
  - name: hw11
    rules:
      - alert: HighTTFC
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[30s]))) > 0.65
            and sum(increase(hw11_ttfc_seconds_count[30s])) >= 15
        for: 16s
        labels: {severity: warning}
        annotations: {summary: "p95 TTFC exceeds 650 ms"}
      - alert: HighRejectionRatio
        expr: |
          sum(rate(hw11_requests_total{outcome=~"overloaded|warming"}[30s]))
          / sum(rate(hw11_requests_total[30s])) > 0.10
            and sum(increase(hw11_requests_total[30s])) >= 15
        for: 16s
        labels: {severity: warning}
        annotations: {summary: "More than 10% of observed requests were rejected"}

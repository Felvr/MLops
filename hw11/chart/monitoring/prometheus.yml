global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: ["/etc/prometheus/rules.yml"]
scrape_configs:
  - job_name: api
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [hw11]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
        action: keep
        regex: hw11-api;http
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["hw11-kube-state:8080"]
  - job_name: cadvisor
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    scrape_interval: 5s
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
    metric_relabel_configs:
      - source_labels: [namespace, container, __name__]
        regex: hw11;api;container_(cpu_usage_seconds_total|memory_working_set_bytes)
        action: keep
